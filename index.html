<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת שעות אקשטיין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* פלטה: נייר-בית-ספר בהיר וקריא, שני מבטאים סמנטיים שמבחינים בין שני
   כיווני החיפוש - טיל (ט) לכיתה, חול-זהב (ט2) למורה - לא רק דקורטיבי */
:root {
  --paper: #f4f3ee;
  --panel: #ffffff;
  --ink: #23281f;
  --muted: #6d7267;
  --border: #ddd9cc;
  --accent-class: #2f6f5e;
  --accent-class-soft: #e4efe9;
  --accent-teacher: #a85f2b;
  --accent-teacher-soft: #f3e9dd;
  --accent-subs: #94433c;
  --accent-subs-soft: #f5e6e3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1d18; --panel: #26281f; --ink: #eae7dc; --muted: #a3a596;
    --border: #3a3d2f; --accent-class: #7fc4ac; --accent-class-soft: #223229;
    --accent-teacher: #e0a465; --accent-teacher-soft: #332619;
    --accent-subs: #e0938c; --accent-subs-soft: #332420;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1d18; --panel: #26281f; --ink: #eae7dc; --muted: #a3a596;
  --border: #3a3d2f; --accent-class: #7fc4ac; --accent-class-soft: #223229;
  --accent-teacher: #e0a465; --accent-teacher-soft: #332619;
  --accent-subs: #e0938c; --accent-subs-soft: #332420;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Assistant", "Segoe UI", Arial, sans-serif; direction: rtl;
  display: flex; justify-content: center; padding: 28px 14px 60px;
}
.card { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
h1 {
  margin: 0; font-family: "Frank Ruhl Libre", "Times New Roman", serif;
  font-weight: 700; font-size: 26px; text-wrap: balance;
}
p.hint { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
fieldset {
  border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  margin: 0; display: flex; flex-direction: column; gap: 12px;
  background: var(--panel);
}
fieldset.class-block { border-inline-start: 4px solid var(--accent-class); }
fieldset.teacher-block { border-inline-start: 4px solid var(--accent-teacher); }
fieldset.subs-block { border-inline-start: 4px solid var(--accent-subs); }
legend {
  font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: 16px;
  padding: 0 6px;
}
.class-block legend { color: var(--accent-class); }
.teacher-block legend { color: var(--accent-teacher); }
.subs-block legend { color: var(--accent-subs); }
.subs-block .subs-date { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: -6px; }
.subs-scroll { overflow-x: auto; }
table.subs-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.subs-table th {
  text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border);
  font-weight: 700; color: var(--muted); font-size: 12px;
  white-space: nowrap;
}
table.subs-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
table.subs-table tr:last-child td { border-bottom: none; }
table.subs-table td:last-child, table.subs-table th:last-child {
  text-align: center; font-variant-numeric: tabular-nums;
}
label {
  display: flex; flex-direction: column; gap: 5px; font-size: 12.5px;
  font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
}
select {
  font: inherit; font-size: 16px; font-weight: 600; padding: 11px 12px; width: 100%;
  border: 1px solid var(--border); border-radius: 9px; text-transform: none;
  background: var(--paper); color: var(--ink); letter-spacing: normal;
}
select:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
.result {
  margin-top: 2px; border-radius: 10px; border: 1px dashed var(--border);
  padding: 12px 14px; font-size: 14.5px; min-height: 22px;
}
.class-block .result { background: var(--accent-class-soft); }
.teacher-block .result { background: var(--accent-teacher-soft); }
.result .row { padding: 6px 0; border-bottom: 1px solid var(--border); }
.result .row:last-child { border-bottom: none; }
.result .subject { font-weight: 700; }
.result .teachers, .result .class { color: var(--muted); font-size: 13px; }
.result .empty { color: var(--muted); }
button.week-toggle {
  font: inherit; font-size: 13px; font-weight: 700; text-transform: none;
  letter-spacing: normal; padding: 9px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; width: fit-content;
}
.class-block button.week-toggle { color: var(--accent-class); border-color: var(--accent-class); }
.teacher-block button.week-toggle { color: var(--accent-teacher); border-color: var(--accent-teacher); }
.week-grid-wrap { display: none; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table.week-grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.week-grid th {
  padding: 7px 5px; text-align: center; border-bottom: 1px solid var(--border);
  font-weight: 700; color: var(--muted); font-size: 11px; white-space: nowrap;
  background: var(--paper);
}
table.week-grid td {
  padding: 6px 5px; border-bottom: 1px solid var(--border); vertical-align: top;
  text-align: center; min-width: 76px;
}
table.week-grid tr:last-child td { border-bottom: none; }
table.week-grid td.hour-cell {
  font-weight: 700; background: var(--paper); white-space: nowrap;
  font-variant-numeric: tabular-nums; min-width: auto;
}
.week-grid .lesson + .lesson { margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--border); }
.week-grid .lesson .subject { font-weight: 700; }
.week-grid .lesson .who { color: var(--muted); font-size: 11px; }
.footer {
  text-align: center; font-size: 12px; color: var(--muted); margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
</style>
</head>

    <button class="week-toggle" type="button" id="classWeekToggle" style="display:none;">הצג מערכת שבועית מלאה</button>
    <div class="week-grid-wrap" id="classWeekWrap"></div>
  </fieldset>

  <fieldset class="teacher-block">

    <label>יום

    <label>שעה

</div>

const DAYS = ["יום א", "יום ב", "יום ג", "יום ד", "יום ה", "יום ו"];

function fillSelect(sel, values) {
  for (const v of values) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  }
}

const classes = [...new Set(SCHEDULE.map(r => r.class))].sort();
const hours = [...new Set(SCHEDULE.map(r => r.hour))].sort((a, b) => a - b);
// רשימת המורים לחיפוש מגיעה מ-TEACHER_SCHEDULE (דוח "מערכת שעות למורה"
// לכל אדם בנפרד, שם מלא וחד-משמעי) ולא מ-SCHEDULE (דוח לפי כיתה, ששם
// רק פרטי מוצג בתא, ואם כמה אנשי צוות חולקים שם פרטי - זה מתערבב)
const teacherHours = [...new Set(TEACHER_SCHEDULE.map(r => r.hour))].sort((a, b) => a - b);
const teacherNames = [...new Set(TEACHER_SCHEDULE.map(r => r.teacher))].sort();

fillSelect(document.getElementById("classSelect"), classes);
fillSelect(document.getElementById("classDay"), DAYS);
fillSelect(document.getElementById("classHour"), hours);
fillSelect(document.getElementById("teacherSelect"), teacherNames);
fillSelect(document.getElementById("teacherDay"), DAYS);
fillSelect(document.getElementById("teacherHour"), teacherHours);

function renderClassResult() {
  const cls = document.getElementById("classSelect").value;
  const day = document.getElementById("classDay").value;
  const hour = document.getElementById("classHour").value;
  const box = document.getElementById("classResult");
  if (!cls || !day || !hour) {
    box.innerHTML = '<span class="empty">בחר/י כיתה, יום ושעה</span>';
    return;
  }
  const matches = SCHEDULE.filter(r => r.class === cls && r.day === day && String(r.hour) === hour);
  if (!matches.length) {
    box.innerHTML = '<span class="empty">לא נמצא שיעור בשעה הזו</span>';
    return;
  }
  box.innerHTML = matches.map(r =>
    `<div class="row"><div class="subject">${r.subject}</div><div class="teachers">${r.teachers}</div></div>`
  ).join("");
}

function renderTeacherResult() {
  const teacher = document.getElementById("teacherSelect").value;
  const day = document.getElementById("teacherDay").value;
  const hour = document.getElementById("teacherHour").value;
  const box = document.getElementById("teacherResult");
  if (!teacher || !day || !hour) {
    box.innerHTML = '<span class="empty">בחר/י מורה, יום ושעה</span>';
    return;
  }
  const matches = TEACHER_SCHEDULE.filter(r => r.teacher === teacher && r.day === day && String(r.hour) === hour);
  if (!matches.length) {
    box.innerHTML = '<span class="empty">לא נמצא שיעור בשעה הזו</span>';
    return;
  }
  box.innerHTML = matches.map(r =>
    `<div class="row"><div class="subject">${r.subject}</div>${r.classes ? `<div class="class">${r.classes}</div>` : ''}</div>`
  ).join("");
}

for (const id of ["classSelect", "classDay", "classHour"]) {
  document.getElementById(id).addEventListener("change", renderClassResult);
}
for (const id of ["teacherSelect", "teacherDay", "teacherHour"]) {
  document.getElementById(id).addEventListener("change", renderTeacherResult);
}

function renderWeekGrid(rows, whoField) {
  if (!rows.length) {
    return '<div style="padding:14px;color:var(--muted);font-size:13px;">אין נתונים.</div>';
  }
  const rowHours = [...new Set(rows.map(r => r.hour))].sort((a, b) => a - b);
  let html = '<table class="week-grid"><thead><tr><th>שעה</th>';
  for (const d of DAYS) html += `<th>${d}</th>`;
  html += '</tr></thead><tbody>';
  for (const h of rowHours) {
    html += `<tr><td class="hour-cell">${h}</td>`;
    for (const d of DAYS) {
      const cell = rows.filter(r => r.day === d && r.hour === h);
      if (!cell.length) { html += '<td></td>'; continue; }
      html += '<td>' + cell.map(r =>
        `<div class="lesson"><div class="subject">${r.subject}</div>${r[whoField] ? `<div class="who">${r[whoField]}</div>` : ''}</div>`
      ).join('') + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function setupWeekToggle(selectId, toggleId, wrapId, filterFn, whoField) {
  const select = document.getElementById(selectId);
  const toggle = document.getElementById(toggleId);
  const wrap = document.getElementById(wrapId);

  function refresh() {
    const value = select.value;
    wrap.style.display = "none";
    toggle.textContent = "הצג מערכת שבועית מלאה";
    if (!value) {
      toggle.style.display = "none";
      wrap.innerHTML = "";
      return;
    }
    toggle.style.display = "block";
    wrap.innerHTML = renderWeekGrid(filterFn(value), whoField);
  }

  toggle.addEventListener("click", () => {
    const show = wrap.style.display !== "block";
    wrap.style.display = show ? "block" : "none";
    toggle.textContent = show ? "הסתר מערכת שבועית" : "הצג מערכת שבועית מלאה";
  });
  select.addEventListener("change", refresh);
}

setupWeekToggle("classSelect", "classWeekToggle", "classWeekWrap",
  cls => SCHEDULE.filter(r => r.class === cls), "teachers");
setupWeekToggle("teacherSelect", "teacherWeekToggle", "teacherWeekWrap",
  teacher => TEACHER_SCHEDULE.filter(r => r.teacher === teacher), "classes");
